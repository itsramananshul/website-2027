name: Deliver registration notifications
on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
permissions:
  contents: read
concurrency:
  group: intake-notifications
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Deliver queued notifications and expire attendance offers
        env:
          INTAKE_WEBSITE_URL: ${{ vars.INTAKE_WEBSITE_URL }}
          INTAKE_CRON_SECRET: ${{ secrets.INTAKE_CRON_SECRET }}
        run: |
          if [ -z "$INTAKE_WEBSITE_URL" ] || [ -z "$INTAKE_CRON_SECRET" ]; then
            echo "Notification worker is not configured yet."
            exit 0
          fi
          case "$INTAKE_WEBSITE_URL" in
            https://*) ;;
            *) echo "INTAKE_WEBSITE_URL must use HTTPS."; exit 1 ;;
          esac
          curl --fail --silent --show-error --max-time 90 \
            --header "Authorization: Bearer $INTAKE_CRON_SECRET" \
            "${INTAKE_WEBSITE_URL%/}/api/intake/notifications"
